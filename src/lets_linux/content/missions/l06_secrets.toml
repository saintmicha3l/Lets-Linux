schema = 1

[mission]
id = "l06-secrets"
title = "Passwords in Plain Sight"
chapter = "L"
kind = "troubleshooting"
order = 8
difficulty = 5
requires = ["l03-permission-audit", "h03-your-own-service", "l01b-audit-toolkit"]
skills = ["l.secrets-management", "d.credential-hygiene"]
review_for = ["h.unit-files", "c.grep-basics"]
xp = 200
estimated_minutes = 35

[briefing]
context = """
The shop API on this Debian server needs the database password, and it gets it the lazy way:
from a .env file in its program directory that every user can read. The password has also
been typed on a command line once. Lock the secret down so that only the service can read it,
then rotate it — assume the old one is known. The API must keep running.
(sudo password: letslinux)
"""
concept = """
A secret is only as safe as the most readable copy. Look for copies: grep -rl in program and
configuration directories, shell histories (~/.bash_history), unit files (world-readable, and
Environment= values are shown by systemctl show to everyone). A good home for a service's
secret is a file only root may read — systemd reads EnvironmentFile= as root before dropping
privileges — e.g. /etc/shop/shop.env with mode 600, or root:shop 640 when the program reads
it itself. After a leak, rotation (a new value everywhere it is used) matters more than
hiding the old one. Generate secrets from randomness: head -c 24 /dev/urandom | base64.
"""
objectives = ["Find copies of a secret", "Restrict a secret file to the service", "Use EnvironmentFile= safely", "Rotate a leaked secret"]

[environment]
profile = "debian"
packages = ["netcat"]
[environment.vars]
oldpw = { choices = ["Shop2024!summer", "winter-Sale-99", "p4ssw0rd-shopdb"] }

[[environment.setup]]
action = "user"
name = "shop"
system = true
shell = "/usr/sbin/nologin"
home = "/opt/shop"

[[environment.setup]]
action = "file"
path = "/opt/shop/.env"
mode = "0644"
content = """# shop API settings
DB_HOST=db.example.lan
DB_USER=shop
DB_PASSWORD={{oldpw}}
"""

[[environment.setup]]
action = "file"
path = "/opt/shop/run.sh"
mode = "0755"
content = """#!/bin/sh
# start the shop API (needs DB_PASSWORD)
[ -n "$DB_PASSWORD" ] || { echo "shop-api: DB_PASSWORD is not set" >&2; exit 1; }
exec /usr/bin/nc -lk 8080
"""

[[environment.setup]]
action = "service"
name = "shopapi.service"
enable = true
start = true
content = """[Unit]
Description=Shop API
After=network.target

[Service]
User=shop
EnvironmentFile=/opt/shop/.env
ExecStart=/opt/shop/run.sh

[Install]
WantedBy=multi-user.target
"""

[[environment.setup]]
action = "file"
path = "~/.bash_history"
mode = "0600"
content = """ls /opt/shop
mysql -h db.example.lan -u shop -p'{{oldpw}}' shop
systemctl status shopapi
"""

[[task]]
id = "find"
title = "Where is the secret?"
kind = "troubleshooting"
instructions = "Find the readable-by-everyone file that holds the database password."
skills = { "l.secrets-management" = 1.0, "c.grep-basics" = 0.5 }
question = { prompt = "Full path of that file?", type = "exact", accept = ["/opt/shop/.env"] }
hints = ["Which file does the unit load? systemctl cat shopapi", "ls -la /opt/shop — names starting with a dot are hidden from plain ls.", "/opt/shop/.env, mode 644: everyone may read it."]
explanation = "Any local user — or any compromised service running as another user — could read it."

[[task]]
id = "lockdown"
title = "Only for the service"
kind = "independent"
instructions = "Make sure no other account can read the password any more, while the shop API keeps getting it. Keep the settings in a file (not in the unit file itself)."
skills = { "l.secrets-management" = 1.0, "h.unit-files" = 0.5 }
checks = [
    { type = "command_result", user = "www-data", command = "grep -rl -- 'DB_PASSWORD=' /opt /etc /srv /var/lib 2>/dev/null", stdout_equals = "" },
    { type = "command_result", user = "root", command = "systemctl cat shopapi", stdout_not_contains = ["DB_PASSWORD="] },
    { type = "unit_state", unit = "shopapi.service", active = "active" },
    { type = "port_listening", port = 8080 },
    { type = "after_reboot", checks = [{ type = "unit_state", unit = "shopapi.service", active = "active" }] },
]
hints = [
    "chmod 600 makes a file readable by its owner only — and systemd reads EnvironmentFile= as root.",
    "Simplest: sudo chown root:root /opt/shop/.env && sudo chmod 600 /opt/shop/.env. Tidier: move it to /etc/shop/shop.env and update EnvironmentFile= (daemon-reload!).",
    "Restart the service and check: sudo systemctl restart shopapi; systemctl is-active shopapi",
]
explanation = "The game searched every common directory as www-data — another service account — and found nothing; the API still starts, also after a reboot."

[[task]]
id = "rotate"
title = "Rotate the leaked password"
kind = "independent"
instructions = "The old password appeared in a shell history, so treat it as known. Give the service a new random password of at least 16 characters (the database team will set the same value on their side), and remove the old one from your shell history."
skills = { "l.secrets-management" = 1.0, "d.credential-hygiene" = 1.0 }
checks = [
    { type = "command_result", user = "root", command = "pid=$(systemctl show -p MainPID --value shopapi); v=$(tr '\\0' '\\n' < /proc/$pid/environ | sed -n 's/^DB_PASSWORD=//p'); [ -n \"$v\" ] && [ \"$v\" != '{{oldpw}}' ] && [ ${#v} -ge 16 ]", status = 0 },
    { type = "file_not_contains", path = "~/.bash_history", text = "{{oldpw}}" },
    { type = "command_result", user = "www-data", command = "grep -rl -- 'DB_PASSWORD=' /opt /etc /srv /var/lib 2>/dev/null", stdout_equals = "" },
]
hints = [
    "Random data: head -c 24 /dev/urandom | base64. Avoid typing the new password in a command line — write it into the file with a pipeline.",
    "sudo sed -i \"s|^DB_PASSWORD=.*|DB_PASSWORD=$(head -c 24 /dev/urandom | base64)|\" /etc/shop/shop.env (or the file you used), then sudo systemctl restart shopapi",
    "History: sed -i '/mysql .*-p/d' ~/.bash_history (history -c clears the current shell's list).",
]
explanation = "The running service now has a new, random password — the game read it from /proc/PID/environ. The old one is worthless."

[[task]]
id = "why"
title = "Not in the unit file"
kind = "explanation"
instructions = "Think about where else secrets end up."
skills = { "l.secrets-management" = 1.0 }
question = { prompt = "Why is Environment=DB_PASSWORD=… directly in the unit file a poor choice?", type = "choice", choices = ["systemd ignores Environment=", "Unit files are world-readable, and systemctl show/cat displays Environment= to every user", "It is only read at boot"], answer = 1 }
hints = ["Who may run systemctl cat?", "ls -l /etc/systemd/system/*.service", "(b)"]
explanation = "Use EnvironmentFile= with a 600 file — or systemd credentials (LoadCredential=), which are not even placed in the environment."

[debrief]
summary = """
Find every copy (grep -rl, histories, unit files) → keep one copy, readable only by root or
the service → let systemd pass it in (EnvironmentFile=) → rotate after a leak → restart and
verify.
"""
alternatives = ["systemd LoadCredential= / systemd-creds (secrets as files in $CREDENTIALS_DIRECTORY)", "A secrets manager (Vault, cloud KMS)", "HISTCONTROL=ignorespace: commands starting with a space are not saved"]
pitfalls = ["chmod 600 on a file the program itself reads while running as another user (use root:GROUP 640 then).", "Rotating in the file but not restarting the service.", "Typing the new password on the command line — into the history again."]
next = "Next: a process that should not be there."

[[solution]]
name = "move to /etc and rotate"
steps = [
    "systemctl cat shopapi",
    "ls -la /opt/shop",
    ":answer /opt/shop/.env",
    { input = ["letslinux"] },
    "sudo mkdir -p /etc/shop",
    "sudo mv /opt/shop/.env /etc/shop/shop.env",
    "sudo chown root:root /etc/shop/shop.env",
    "sudo chmod 600 /etc/shop/shop.env",
    "sudo sed -i 's|^EnvironmentFile=.*|EnvironmentFile=/etc/shop/shop.env|' /etc/systemd/system/shopapi.service",
    "sudo systemctl daemon-reload",
    "sudo systemctl restart shopapi",
    "sudo sed -i \"s|^DB_PASSWORD=.*|DB_PASSWORD=$(head -c 24 /dev/urandom | base64)|\" /etc/shop/shop.env",
    "sudo systemctl restart shopapi",
    "sed -i '/mysql/d' ~/.bash_history",
    ":answer b",
]

[[solution]]
name = "chmod in place"
steps = [
    "ls -la /opt/shop",
    ":answer /opt/shop/.env",
    { input = ["letslinux"] },
    "sudo chmod 600 /opt/shop/.env",
    "sudo chown root:root /opt/shop/.env",
    "new=$(head -c 30 /dev/urandom | base64) && sudo sed -i \"s|^DB_PASSWORD=.*|DB_PASSWORD=$new|\" /opt/shop/.env",
    "sudo systemctl restart shopapi",
    "grep -v -- '-p' ~/.bash_history > /tmp/h && mv /tmp/h ~/.bash_history",
    ":answer Unit files are world-readable, and systemctl show/cat displays Environment= to every user",
]

[[counterexample]]
name = "secret into the unit file"
steps = [
    ":answer /opt/shop/.env",
    { input = ["letslinux"] },
    "sudo rm /opt/shop/.env",
    "sudo sed -i 's|^EnvironmentFile=.*|Environment=DB_PASSWORD=aVeryLongNewPassword123|' /etc/systemd/system/shopapi.service",
    "sudo systemctl daemon-reload",
    "sudo systemctl restart shopapi",
    ":answer b",
]
