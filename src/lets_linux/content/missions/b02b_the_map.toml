schema = 1

[mission]
id = "b02b-the-map"
title = "The Map of the System"
chapter = "B"
kind = "lesson"
order = 3
difficulty = 1
requires = ["b02-looking-around"]
skills = ["b.fhs-layout"]
review_for = ["b.fhs-layout"]
xp = 60
estimated_minutes = 12

[briefing]
context = """
Every Linux system follows the same map, the Filesystem Hierarchy Standard. Once you know it,
you know where to look on any server: for its configuration, its logs, its programs and its
users' files. Take a guided tour.
"""
concept = """
/etc   configuration (text files: /etc/hostname, /etc/ssh/sshd_config, /etc/passwd)
/var   data that changes while the system runs: /var/log (logs), /var/lib (state), /var/cache
/usr   installed software: /usr/bin (programs), /usr/lib (libraries), /usr/share (docs, data)
/home  users' home directories; root's home is /root
/tmp   temporary files, cleaned regularly — never keep anything there
/proc, /sys  not files on disk: windows into the running kernel and its processes
/dev   device files (disks, terminals); /boot the kernel and boot loader; /opt add-on software;
/srv   data served by this machine (web sites, shares); /mnt and /media mount points
"""
objectives = ["Know what each top-level directory is for", "Find configuration, logs and programs on an unfamiliar system"]

[environment]
profile = "debian"
[environment.vars]
service = { choices = ["ssh", "cron", "rsyslog"] }

[[task]]
id = "top"
title = "The top level"
kind = "guided"
instructions = "List the top of the tree:  ls /"
skills = { "b.fhs-layout" = 1.0 }
checks = [{ type = "output_contains", text = "etc", command = ["ls"] }, { type = "command_used", command = ["ls"], args_contain = ["/"] }]
hints = ["/ is the root of the whole tree.", "ls / lists the directories directly under it.", "Type: ls /"]
explanation = "Every path on the system starts here. There are no drive letters: other disks are attached (mounted) somewhere inside this one tree."

[[task]]
id = "config"
title = "Where configuration lives"
kind = "guided"
instructions = "Configuration lives in /etc. Find the configuration file of the SSH server:  ls /etc/ssh"
skills = { "b.fhs-layout" = 1.0 }
question = { prompt = "What is the full path of the SSH server's configuration file?", type = "exact", accept = ["/etc/ssh/sshd_config"] }
hints = ["The server is sshd — note the d for daemon.", "ls /etc/ssh shows ssh_config (the client's) and sshd_config (the server's).", "The answer is /etc/ssh/sshd_config."]
explanation = "Almost all system configuration is plain text under /etc, usually in a directory or file named after the program."

[[task]]
id = "logs"
title = "Where logs live"
kind = "guided"
instructions = "Logs live in /var/log:  ls /var/log"
skills = { "b.fhs-layout" = 1.0 }
question = { prompt = "Which directory holds the system's log files?", type = "exact", accept = ["/var/log", "/var/log/"] }
hints = ["var stands for variable: data that changes while the system runs.", "ls /var/log lists the log files.", "The answer is /var/log."]
explanation = "/var holds changing data: logs in /var/log, program state in /var/lib, caches in /var/cache, mail and print queues in /var/spool. A full /var is a classic outage."

[[task]]
id = "programs"
title = "Where programs live"
kind = "guided"
instructions = "Find out where the ls program itself is stored:  which ls"
skills = { "b.fhs-layout" = 1.0 }
question = { prompt = "In which directory is the ls program?", type = "exact", accept = ["/usr/bin", "/usr/bin/", "/bin", "/bin/"] }
hints = ["which prints the full path of a command.", "Programs installed by packages go into /usr/bin (and /usr/sbin for administrator tools).", "The answer is /usr/bin."]
explanation = "Packages install programs into /usr/bin and /usr/sbin; on modern systems /bin is just a link to /usr/bin. Software installed by hand goes into /usr/local or /opt instead."

[[task]]
id = "proc"
title = "Not really files"
kind = "guided"
instructions = "/proc is generated by the kernel on the fly. Read how long the system has been up:  cat /proc/uptime   then look at its size:  ls -l /proc/uptime"
skills = { "b.fhs-layout" = 1.0 }
question = { prompt = "What size does ls -l report for /proc/uptime?", type = "number", accept = ["0"] }
hints = ["cat shows content, but ls -l shows the size the file claims to have.", "Files in /proc are generated when you read them, so they have no stored size.", "The answer is 0."]
explanation = "/proc (and /sys) are windows into the kernel: reading /proc/uptime asks the kernel right now. Chapter G uses /proc to inspect processes."

[[task]]
id = "where"
title = "Find your way"
kind = "independent"
instructions = "Without being told the path: list or show the configuration of {{service}} under /etc (a directory or file whose name starts with {{service}})."
skills = { "b.fhs-layout" = 1.0 }
checks = [{ type = "command_used", command = ["ls", "cat", "less", "head", "find", "stat", "file"], args_regex = "(^|\\s)/etc/{{service}}", success = true }]
hints = ["Configuration is under /etc, named after the program.", "ls /etc | grep {{service}} shows the candidates.", "For example: ls -d /etc/{{service}}*"]
explanation = "The map works on any distribution: configuration under /etc, named after the program, nearly always."

[[task]]
id = "tmp"
title = "Choose the right place"
kind = "prediction"
instructions = "Think about what each directory promises."
skills = { "b.fhs-layout" = 1.0 }
question = { prompt = "Where should a web server's site files (served to visitors) go on a fresh system?", type = "choice", choices = ["/tmp/www", "/srv/www (or /var/www)", "/etc/www", "/proc/www"], answer = 1 }
hints = ["/tmp is cleaned; /etc is configuration; /proc belongs to the kernel.", "/srv is for data the machine serves; Debian's web servers use /var/www.", "The answer is (b)."]
explanation = "Putting data in the right place means backups, permissions and clean-up jobs treat it correctly: /tmp may be wiped at reboot, /etc is for configuration only."

[debrief]
summary = """
/etc configuration, /var changing data and logs, /usr installed software, /home users,
/tmp temporary, /proc and /sys the kernel's view, /dev devices, /srv served data, /opt add-ons.
The same map works on every distribution.
"""
alternatives = ["man hier describes the hierarchy in detail", "ls -l / shows which top-level names are links (for example /bin -> usr/bin)"]
pitfalls = ["Keeping important files in /tmp: it is cleaned automatically.", "Editing files under /usr: package upgrades overwrite them — local changes belong in /etc or /usr/local."]
next = "Next: making files and directories of your own."

[[solution]]
name = "as instructed"
steps = ["ls /", "ls /etc/ssh", ":answer /etc/ssh/sshd_config", "ls /var/log", ":answer /var/log", "which ls", ":answer /usr/bin", "cat /proc/uptime", "ls -l /proc/uptime", ":answer 0", "ls /etc | grep {{service}}", "ls -d /etc/{{service}}*", ":answer b"]

[[solution]]
name = "other tools"
steps = ["ls -l /", "cd /etc/ssh && ls", ":answer /etc/ssh/sshd_config", "cd /var/log && ls", ":answer /var/log/", "command -v ls", ":answer /usr/bin/", "stat -c %s /proc/uptime", ":answer 0", "cd", "ls -d /etc/cron.d /etc/ssh /etc/rsyslog.conf", ":answer 2"]

[[counterexample]]
name = "guessing"
steps = [":answer /etc/ssh/sshd_config", ":answer /var/log", ":answer /usr/bin", ":answer 0", ":answer b"]
