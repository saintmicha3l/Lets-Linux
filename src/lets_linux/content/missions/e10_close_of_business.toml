schema = 1

[mission]
id = "e10-close-of-business"
title = "Close of Business"
chapter = "E"
kind = "challenge"
order = 12
difficulty = 3
requires = ["e09-scripting-checkpoint", "c04-columns", "d02-chmod"]
skills = ["c.awk-fields", "c.sort-uniq", "e.script-structure", "d.chmod-octal"]
review_for = ["c.awk-fields", "c.sort-uniq", "e.positional-args", "d.chmod-octal"]
xp = 150
estimated_minutes = 25
sequential = false

[briefing]
context = """
End of the day. Before you log off, the on-call engineer wants a one-line-per-offender tally
of the busiest clients in today's web log, and the monitoring group needs to be able to read
that log without you handing it over by hand each evening. No new tools here — just the text
processing, scripting and permissions you already know, used together.
"""
concept = "Chain the pipeline tools (cut/awk, sort, uniq, head) inside a small, argument-checked script, then set file permissions precisely with octal chmod."
objectives = [
    "Summarise a log with a reusable, argument-checked script",
    "Grant group read with an exact permission mode, nothing more",
]

[environment]
profile = "debian"

[[environment.setup]]
action = "dir"
path = "/home/learner/bin"
owner = "learner"
group = "learner"

[[environment.setup]]
action = "dir"
path = "/home/learner/logs"
owner = "learner"
group = "learner"

[[environment.setup]]
action = "file"
path = "/home/learner/logs/access.log"
owner = "learner"
group = "learner"
mode = "0600"
content = """10.0.0.5 - - [10/Oct/2026:09:01:14 +0000] "GET /index.html HTTP/1.1" 200 812
10.0.0.9 - - [10/Oct/2026:09:01:40 +0000] "GET /about HTTP/1.1" 200 410
10.0.0.5 - - [10/Oct/2026:09:02:03 +0000] "GET /pricing HTTP/1.1" 200 932
10.0.0.2 - - [10/Oct/2026:09:02:51 +0000] "GET /index.html HTTP/1.1" 200 812
10.0.0.5 - - [10/Oct/2026:09:03:22 +0000] "GET /contact HTTP/1.1" 200 355
10.0.0.9 - - [10/Oct/2026:09:03:58 +0000] "GET /index.html HTTP/1.1" 200 812
10.0.0.7 - - [10/Oct/2026:09:04:30 +0000] "GET /robots.txt HTTP/1.1" 404 199
10.0.0.5 - - [10/Oct/2026:09:05:11 +0000] "GET /pricing HTTP/1.1" 200 932
10.0.0.9 - - [10/Oct/2026:09:05:46 +0000] "GET /about HTTP/1.1" 200 410
10.0.0.2 - - [10/Oct/2026:09:06:09 +0000] "GET /index.html HTTP/1.1" 200 812
"""

[[task]]
id = "tally"
title = "Top talkers"
kind = "independent"
instructions = """
Write ~/bin/toptalkers (executable). Given a log file path as its first argument, it prints
the three busiest client IP addresses — the first field of each line — one per line as
"COUNT IP", most requests first. For today's log, toptalkers ~/logs/access.log must print:
4 10.0.0.5
3 10.0.0.9
2 10.0.0.2
Run with no argument, it prints "usage: toptalkers LOGFILE" to standard error and exits 2.
"""
skills = { "c.awk-fields" = 1.0, "c.sort-uniq" = 1.0, "e.script-structure" = 0.5, "e.positional-args" = 0.5 }
checks = [
    { type = "command_result", user = "learner", command = "~/bin/toptalkers ~/logs/access.log", status = 0, stdout_equals = "4 10.0.0.5\n3 10.0.0.9\n2 10.0.0.2\n" },
    { type = "command_result", user = "learner", command = "~/bin/toptalkers", status = 2, stdout_equals = "", stderr_contains = ["usage: toptalkers LOGFILE"] },
]
hints = [
    "Count by the first field, then sort by the count and keep the top three: ... | sort -rn | head -3.",
    "uniq -c only groups adjacent lines, so sort first; or let awk count into an array keyed by $1.",
    "#!/bin/bash\\n[ -n \"$1\" ] || { echo 'usage: toptalkers LOGFILE' >&2; exit 2; }\\nawk '{n[$1]++} END{for (ip in n) print n[ip], ip}' \"$1\" | sort -rn | head -3",
]
explanation = "Counting-then-ranking is the same shape whether you group with sort|uniq -c or tally in an awk array; checking $# and reporting usage on stderr with a non-zero status makes the script safe to reuse."

[[task]]
id = "handoff"
title = "Readable for the monitors"
kind = "independent"
instructions = """
The monitoring group reads logs as members of the group that already owns the file. Give
~/logs/access.log group read access and nothing more — it must end up mode 640 (owner
read/write, group read, no world access), still owned by learner:learner.
"""
skills = { "d.chmod-octal" = 1.0, "d.permission-bits" = 0.5 }
checks = [
    { type = "file_mode", path = "/home/learner/logs/access.log", mode = "640" },
    { type = "file_owner", path = "/home/learner/logs/access.log", user = "learner", group = "learner" },
]
hints = [
    "Octal chmod sets all three groups of bits at once: owner, group, other.",
    "Read is 4, write is 2, execute is 1; owner needs read+write, group needs read, other needs nothing.",
    "chmod 640 ~/logs/access.log",
]
explanation = "640 = rw- r-- ---: the owner keeps read and write, the group gains read, and everyone else is shut out — the least access that satisfies the request."

[debrief]
summary = "Small scripts turn a pipeline into a reusable tool; always check arguments and fail loudly. Octal chmod grants exactly the bits you name — 640 is the minimal 'owner writes, group reads' mode."
alternatives = [
    "sort | uniq -c | sort -rn | head -3 instead of an awk tally",
    "chmod g+r,o= instead of the octal form",
]
pitfalls = [
    "Forgetting head -3 and dumping every client.",
    "Using chmod 644 (world-readable) when only the group was asked for.",
]
next = "You have combined text processing, scripting and permissions on one task — the pattern behind most day-to-day admin work."

[[solution]]
name = "awk tally and octal chmod"
steps = [
    "printf '#!/bin/bash\\n[ -n \"$1\" ] || { echo \"usage: toptalkers LOGFILE\" >&2; exit 2; }\\nawk \"{n[\\$1]++} END{for (ip in n) print n[ip], ip}\" \"$1\" | sort -rn | head -3\\n' > ~/bin/toptalkers",
    "chmod +x ~/bin/toptalkers",
    "~/bin/toptalkers ~/logs/access.log",
    "chmod 640 ~/logs/access.log",
]

[[solution]]
name = "sort|uniq pipeline and symbolic-equivalent octal"
steps = [
    "printf '#!/bin/bash\\n[ -n \"$1\" ] || { echo \"usage: toptalkers LOGFILE\" >&2; exit 2; }\\ncut -d\" \" -f1 \"$1\" | sort | uniq -c | sort -rn | head -3 | sed -E \"s/^ *([0-9]+) +(.*)/\\\\1 \\\\2/\"\\n' > ~/bin/toptalkers",
    "chmod 755 ~/bin/toptalkers",
    "~/bin/toptalkers ~/logs/access.log",
    "chmod 640 ~/logs/access.log",
]

[[counterexample]]
name = "dumps every client"
steps = [
    "printf '#!/bin/bash\\n[ -n \"$1\" ] || { echo \"usage: toptalkers LOGFILE\" >&2; exit 2; }\\nawk \"{n[\\$1]++} END{for (ip in n) print n[ip], ip}\" \"$1\" | sort -rn\\n' > ~/bin/toptalkers",
    "chmod +x ~/bin/toptalkers",
    "chmod 640 ~/logs/access.log",
]
