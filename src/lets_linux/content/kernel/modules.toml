[module.tun]
path = "drivers/net/tun"
description = "Universal TUN/TAP device driver"
license = "GPL"
size = 65536

[module.veth]
path = "drivers/net/veth"
description = "Virtual Ethernet Tunnel"
license = "GPL"
size = 40960

[module.udp_tunnel]
path = "net/ipv4/udp_tunnel"
description = "IPv4 Foo over UDP tunnel driver"
license = "GPL"
size = 32768

[module.ip6_udp_tunnel]
path = "net/ipv6/ip6_udp_tunnel"
description = "IPv6 Foo over UDP tunnel driver"
license = "GPL"
size = 16384

[module.wireguard]
path = "drivers/net/wireguard/wireguard"
description = "WireGuard secure network tunnel"
license = "GPL v2"
depends = ["udp_tunnel", "ip6_udp_tunnel"]
