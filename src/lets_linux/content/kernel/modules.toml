kmsg = "wireguard: WireGuard 1.0.0 loaded. See www.wireguard.com for information."

[module.kvm]
path = "arch/x86/kvm/kvm"
description = "Kernel-based Virtual Machine"
license = "GPL"
size = 1351680
params = { halt_poll_ns = ["200000", "(uint)"] }

[module.kvm_intel]
path = "arch/x86/kvm/kvm-intel"
description = "KVM support for Intel VMX"
