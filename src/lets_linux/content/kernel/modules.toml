[module.loop]
path = "drivers/block/loop"
description = "Loopback device support"
license = "GPL"
size = 40960
params = { max_loop = ["0", "Maximum number of loop devices (int)"], max_part = ["0", "Maximum number of partitions per loop device (int)"] }

[module.pcspkr]
path = "drivers/input/misc/pcspkr"
