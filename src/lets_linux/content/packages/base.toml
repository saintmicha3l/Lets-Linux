# Package catalogue: core system packages.
#
# Each package lists the programs it installs. `bin` entries go to /usr/bin,
# `sbin` entries to /usr/sbin. An entry "name=impl" installs program `name`
# backed by implementation `impl`. Every implementation must exist in the
# command registry (enforced by tests): no placeholder programs.
#
# `names` maps distribution families to native package names; `versions`
# gives per-family versions. Files are installed with the given content.

schema = 1

