# /etc/sysctl.conf - Configuration file for setting system variables
# See /etc/sysctl.d/ for additional system variables.
# See sysctl.conf (5) for information.
#

# Uncomment the next line to enable packet forwarding for IPv4
#net.ipv4.ip_forward=1
"""

[[package.file]]
path = "/etc/sysctl.d/README.sysctl"
content = """Kernel system variables configuration files

Files found in this directory will be processed by systemd-sysctl(8) at boot,
in lexical order. Lines are "variable = value", for example

    vm.swappiness = 10

The changes take effect at the next boot; to apply them now, run
"sysctl --system" (or write the value to /proc/sys).
"""

