# Package catalogue: the C toolchain and libraries to build against (chapter Q).
# Headers are real C declarations in the subset the simulated compiler understands.

schema = 1

[[package]]
name = "libc6-dev"
summary = "GNU C Library: Development Libraries and Header Files"
section = "libdevel"
