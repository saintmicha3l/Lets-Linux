   Copyright (C) 1991-2023 Free Software Foundation, Inc.  (Let's Linux: simplified) */
#ifndef _STDIO_H
#define _STDIO_H 1

#define EOF (-1)
#define BUFSIZ 8192

extern FILE *stdin;
extern FILE *stdout;
extern FILE *stderr;

extern int printf (const char *format, ...);
extern int fprintf (FILE *stream, const char *format, ...);
