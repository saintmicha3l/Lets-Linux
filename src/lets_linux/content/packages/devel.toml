names = { fedora = "glibc-devel", arch = "linux-api-headers" }
versions = { debian = "2.36-9+deb12u9", ubuntu = "2.39-0ubuntu8.3", fedora = "2.40-9.fc41", arch = "6.10-1", generic = "2.40" }
