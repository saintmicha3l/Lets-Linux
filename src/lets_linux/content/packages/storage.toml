# Package catalogue: partitioning and filesystem tools.

schema = 1

[[package]]
name = "fdisk"
summary = "collection of partitioning utilities"
section = "utils"
names = { fedora = "util-linux", arch = "util-linux" }
versions = { debian = "2.38.1-5+deb12u3", ubuntu = "2.39.3-9ubuntu6", fedora = "2.40.2-4.fc41", arch = "2.40.2-1", generic = "2.40" }
sbin = ["fdisk"]

[[package]]
name = "e2fsprogs"
summary = "ext2/ext3/ext4 file system utilities"
section = "admin"
essential = true
versions = { debian = "1.47.0-2", ubuntu = "1.47.0-2.4~exp1ubuntu4.1", fedora = "1.47.1-3.fc41", arch = "1.47.1-4", generic = "1.47.1" }
bin = ["chattr", "lsattr"]
sbin = ["mke2fs", "mkfs.ext2", "mkfs.ext3", "mkfs.ext4", "e2fsck", "fsck.ext4=e2fsck", "tune2fs", "e2label", "resize2fs"]

[[package]]
name = "parted"
summary = "disk partition manipulator"
section = "admin"
versions = { debian = "3.5-3", ubuntu = "3.6-4build1", fedora = "3.6-8.fc41", arch = "3.6-2", generic = "3.6" }
sbin = ["parted"]

[[package]]
name = "xfsprogs"
summary = "utilities for managing the XFS filesystem"
section = "admin"
versions = { debian = "6.1.0-1", ubuntu = "6.6.0-1ubuntu2", fedora = "6.10.1-1.fc41", arch = "6.11.0-1", generic = "6.11.0" }
sbin = ["mkfs.xfs", "xfs_growfs"]

[[package]]
name = "dosfstools"
summary = "utilities for making and checking MS-DOS FAT filesystems"
section = "otherosfs"
versions = { debian = "4.2-1", ubuntu = "4.2-1.1build1", fedora = "4.2-12.fc41", arch = "4.2-5", generic = "4.2" }
sbin = ["mkfs.fat", "mkfs.vfat"]

[[package]]
name = "lvm2"
summary = "Linux Logical Volume Manager"
section = "admin"
size_kb = 2600
versions = { debian = "2.03.16-2", ubuntu = "2.03.16-3ubuntu3", fedora = "2.03.24-1.fc41", arch = "2.03.27-1", generic = "2.03.24" }
sbin = ["pvcreate", "pvremove", "pvs", "pvdisplay", "vgcreate", "vgextend", "vgreduce", "vgremove", "vgs", "vgdisplay",
        "vgchange", "lvcreate", "lvremove", "lvrename", "lvextend", "lvreduce", "lvresize", "lvs", "lvdisplay"]

[[package]]
name = "mdadm"
summary = "Tool to administer Linux MD arrays (software RAID)"
section = "admin"
size_kb = 1300
versions = { debian = "4.2-5", ubuntu = "4.3-1ubuntu2", fedora = "4.3-4.fc41", arch = "4.3-2", generic = "4.3" }
sbin = ["mdadm"]

[[package.file]]
path = "/etc/mdadm/mdadm.conf"
families = ["debian", "generic"]
content = """# mdadm.conf
#
# !NB! Run update-initramfs -u after updating this file.
# !NB! This will ensure that initramfs has an uptodate copy.
#
# Please refer to mdadm.conf(5) for information about this file.
#

# by default (built-in), scan all partitions (/proc/partitions) and all
# containers for MD superblocks. alternatively, specify devices to scan, using
# wildcards if desired.
#DEVICE partitions containers

# automatically tag new arrays as belonging to the local system
HOMEHOST <system>

# instruct the monitoring daemon where to send mail alerts
MAILADDR root

# definitions of existing MD arrays
"""

[[package]]
name = "cryptsetup"
summary = "disk encryption support - startup scripts and command line tool"
section = "admin"
size_kb = 900
names = { debian = "cryptsetup" }
versions = { debian = "2:2.6.1-4~deb12u2", ubuntu = "2:2.7.0-1ubuntu4", fedora = "2.7.5-1.fc41", arch = "2.7.5-1", generic = "2.7.5" }
sbin = ["cryptsetup"]
