[[package]]
name = "rsyslog"
summary = "reliable system and kernel logging daemon"
section = "admin"
families = ["debian"]
versions = { debian = "8.2302.0-1+deb12u1", ubuntu = "8.2312.0-3ubuntu9" }
depends = ["systemd"]
sbin = ["rsyslogd"]
services = ["rsyslog.service"]

[[package.file]]
path = "/etc/logrotate.d/rsyslog"
content = """/var/log/syslog
/var/log/mail.log
/var/log/kern.log
/var/log/auth.log
/var/log/user.log
/var/log/cron.log
{
	rotate 4
	weekly
	missingok
	notifempty
	compress
	delaycompress
	sharedscripts
	postrotate
		/usr/lib/rsyslog/rsyslog-rotate
	endscript
}
"""

[[package.file]]
path = "/usr/lib/rsyslog/rsyslog-rotate"
mode = "755"
content = """#!/bin/sh

if [ -d /run/systemd/system ]; then
    systemctl kill -s HUP rsyslog.service
else
    invoke-rc.d rsyslog rotate > /dev/null
fi
"""

[[package.file]]
path = "/usr/lib/systemd/system/rsyslog.service"
content = """[Unit]
Description=System Logging Service
Documentation=man:rsyslogd(8)
Documentation=man:rsyslog.conf(5)
Documentation=https://www.rsyslog.com/doc/

[Service]
Type=notify
ExecStart=/usr/sbin/rsyslogd -n -iNONE
StandardOutput=null
Restart=on-failure

# Increase the default a bit in order to allow many simultaneous
# files to be monitored, we might need a lot of fds.
LimitNOFILE=16384

[Install]
WantedBy=multi-user.target
Alias=syslog.service
"""

