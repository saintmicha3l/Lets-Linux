# Package catalogue: the service manager and logging daemons, with their unit files.
#
# Unit files are installed under /usr/lib/systemd/system (on Debian 12 that
# directory is reached through the /lib symlink and shown as /lib/systemd/system).
# File entries: path, content, mode, or kind = "symlink" with a target.

schema = 1

[[package]]
name = "systemd"
summary = "system and service manager"
section = "admin"
essential = true
versions = { debian = "252.31-1~deb12u1", ubuntu = "255.4-1ubuntu8.4", fedora = "256.7-1.fc41", arch = "256.7-1", generic = "256.7" }
bin = [
    "journalctl", "systemctl", "hostnamectl", "systemd-analyze", "systemd-cgls", "systemd-cgtop", "systemd-run", "systemd-detect-virt",
    "networkctl",
    "/usr/lib/systemd/systemd-networkd=systemd-networkd",
    "/usr/lib/systemd/systemd-journald=systemd-journald",
    "/usr/lib/systemd/systemd-udevd=systemd-udevd",
    "/usr/lib/systemd/systemd-logind=systemd-logind",
]

[[package.file]]
path = "/usr/lib/systemd/system/systemd-networkd.service"
content = """#  SPDX-License-Identifier: LGPL-2.1-or-later
#
#  This file is part of systemd.

[Unit]
Description=Network Configuration
Documentation=man:systemd-networkd.service(8)
DefaultDependencies=no
After=systemd-udevd.service network-pre.target
Before=network.target multi-user.target shutdown.target
Conflicts=shutdown.target
Wants=network.target

[Service]
Type=notify
ExecStart=/usr/lib/systemd/systemd-networkd
Restart=on-failure

[Install]
WantedBy=multi-user.target
"""

[[package.file]]
path = "/usr/lib/systemd/system/systemd-journald.service"
content = """#  SPDX-License-Identifier: LGPL-2.1-or-later
#
#  This file is part of systemd.

[Unit]
Description=Journal Service
Documentation=man:systemd-journald.service(8) man:journald.conf(5)
DefaultDependencies=no
Before=sysinit.target

[Service]
Type=notify
ExecStart=/usr/lib/systemd/systemd-journald
Restart=always
RestartSec=0
"""

[[package.file]]
path = "/usr/lib/systemd/system/systemd-udevd.service"
content = """#  SPDX-License-Identifier: LGPL-2.1-or-later
#
#  This file is part of systemd.

[Unit]
Description=Rule-based Manager for Device Events and Files
Documentation=man:systemd-udevd.service(8) man:udev(7)
DefaultDependencies=no
After=systemd-journald.service
Before=sysinit.target

[Service]
Type=notify
ExecStart=/usr/lib/systemd/systemd-udevd
Restart=always
RestartSec=0
"""

[[package.file]]
path = "/usr/lib/systemd/system/systemd-logind.service"
content = """#  SPDX-License-Identifier: LGPL-2.1-or-later
#
#  This file is part of systemd.

[Unit]
Description=User Login Management
Documentation=man:sd-login(3)
Documentation=man:systemd-logind.service(8)
Documentation=man:logind.conf(5)
After=nss-user-lookup.target user.slice

[Service]
Type=notify
ExecStart=/usr/lib/systemd/systemd-logind
Restart=always
RestartSec=0
"""

[[package.file]]
path = "/usr/lib/systemd/system/systemd-fsck@.service"
content = """#  SPDX-License-Identifier: LGPL-2.1-or-later
#
#  This file is part of systemd.

[Unit]
Description=File System Check on %f
Documentation=man:systemd-fsck@.service(8)
DefaultDependencies=no
BindsTo=%i.device
Conflicts=shutdown.target
After=%i.device systemd-fsck-root.service local-fs-pre.target
Before=systemd-quotacheck.service shutdown.target

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/lib/systemd/systemd-fsck %f
StandardOutput=journal+console
TimeoutSec=infinity
"""

