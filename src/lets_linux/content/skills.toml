# Let's Linux skill graph.
#
# This file is the machine-readable source of truth for the curriculum's
# knowledge map. `docs/CURRICULUM_MAP.md` is generated from it (plus the
# missions that train and assess each skill) by
# `python scripts/gen_curriculum_map.py`.
#
# Fields:
#   id        unique, "<chapter letter>.<slug>"
#   chapter   chapter id (A–T)
#   title     short name
#   summary   what the learner can do once the skill is acquired
#   requires  prerequisite skill ids (must form a DAG)
#   review    optional manual review status: "reviewed" or "deferred"
#
# Implementation coverage (planned / in progress / implemented / tested) is
# computed from missions and their tests, never declared here.

schema = 1

# ---------------------------------------------------------------- chapters

[[chapter]]
id = "A"
title = "Linux orientation and terminal fundamentals"
track = "core"
summary = "What a terminal and a shell are, how commands are shaped, and how to get help."

[[chapter]]
id = "B"
title = "Navigation, files, paths, and filesystem structure"
track = "core"
summary = "Moving around the tree, creating and managing files, links and archives."

[[chapter]]
id = "C"
title = "Text processing, search, and command composition"
track = "core"
summary = "Streams, redirection, pipelines and the classic text tools."

[[chapter]]
id = "D"
title = "Permissions, ownership, users, and groups"
track = "core"
summary = "The Unix permission model, identities, privilege and least privilege."

[[chapter]]
id = "E"
title = "Shell behavior, pipelines, and scripting"
track = "core"
summary = "How the shell expands and runs commands, and how to write safe scripts."

[[chapter]]
id = "F"
title = "Package management and software provenance"
track = "core"
summary = "Repositories, dependencies, upgrades and trust across distributions."

[[chapter]]
id = "G"
title = "Processes, signals, and resource management"
track = "core"
summary = "Processes, their relationships, signals, jobs and resource usage."

[[chapter]]
id = "H"
title = "systemd, services, boot, and logging"
track = "core"
summary = "Service units, dependencies, failures, the journal and the boot sequence."

[[chapter]]
id = "I"
title = "Networking, DNS, routing, and SSH"
track = "core"
summary = "Addresses, routes, name resolution, sockets, firewalls and remote access."

[[chapter]]
id = "J"
title = "Storage, mounts, filesystems, and backup"
track = "core"
summary = "Block devices, filesystems, capacity, persistence of mounts and recovery."

[[chapter]]
id = "K"
title = "Scheduling, automation, and operational workflows"
track = "core"
summary = "cron, timers and safe, idempotent automation."

[[chapter]]
id = "L"
title = "Security, auditing, hardening, and incident response"
track = "core"
summary = "Defensive administration: audit, harden, detect and respond."

[[chapter]]
id = "M"
title = "Troubleshooting and root-cause analysis"
track = "core"
summary = "Hypothesis-driven diagnosis across subsystems with verified remediation."

[[chapter]]
id = "N"
title = "Kernel, userspace, system calls, and device concepts"
track = "advanced"
summary = "The boundary between kernel and userspace, modules, devices and boot failures."

[[chapter]]
id = "O"
title = "Performance, diagnostics, and observability"
track = "advanced"
summary = "CPU, memory and I/O analysis and observability practice."

[[chapter]]
id = "P"
title = "Containers, virtualization, and isolation"
track = "advanced"
summary = "Namespaces, cgroups, containers and virtual machines."

[[chapter]]
id = "Q"
title = "Linux development, debugging, and build tooling"
track = "advanced"
summary = "Toolchains, libraries, build systems and debugging."

[[chapter]]
id = "R"
title = "Distribution differences and advanced administration"
track = "advanced"
summary = "Transferring skills between Debian/Ubuntu, Fedora and Arch."

[[chapter]]
id = "S"
title = "Specialist learning paths"
track = "specialist"
summary = "Deeper paths into web operations, databases, networking, automation and reliability."

[[chapter]]
id = "T"
title = "Integrated capstone operations scenarios"
track = "capstone"
summary = "Persistent servers with multiple interacting faults."

# ---------------------------------------------------------------- A

[[skill]]
