# The default simulated network around every machine.
#
# The machine itself is 10.0.2.15/24 on the LAN (see distributions/image.py).
# Public addresses use documentation ranges (RFC 5737) except example.com,
# which IANA reserves for examples. Nothing here is ever contacted for real.

schema = 1

# ---------------------------------------------------------------- the LAN 10.0.2.0/24

[[peer]]
name = "gateway"
addresses = ["10.0.2.2"]
mac = "52:55:0a:00:02:02"
router = true
latency_ms = 0.3

[[peer]]
name = "dns"
addresses = ["10.0.2.3"]
mac = "52:55:0a:00:02:03"
latency_ms = 0.3

[[peer]]
name = "intranet"
addresses = ["10.0.2.20"]
mac = "52:54:00:aa:02:14"
[peer.services.80]
kind = "http"
server = "nginx"
[peer.services.80.pages."/"]
body = "<html><body><h1>Example Corp intranet</h1><p>Welcome back.</p></body></html>\n"
[peer.services.80.pages."/status"]
body = "ok\n"
content_type = "text/plain"
[peer.services.22]
kind = "ssh"
banner = "SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3"

[[peer]]
name = "db"
addresses = ["10.0.2.30"]
mac = "52:54:00:aa:02:1e"
[peer.services.5432]
kind = "tcp"
banner = ""

[[peer]]
