kind = "ssh"
banner = "SSH-2.0-OpenSSH_9.6"

[[peer]]
name = "build"
addresses = ["10.0.2.45"]
mac = "52:54:00:aa:02:2d"
[peer.services.22]
kind = "ssh"
banner = "SSH-2.0-OpenSSH_9.8"

[[peer]]
name = "printer"
addresses = ["10.0.2.50"]
